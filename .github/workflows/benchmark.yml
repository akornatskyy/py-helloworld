name: benchmark

on:
  schedule:
    - cron: "0 3 * * 0"  # At 03:00 on Sunday.
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - python-version: '3.15'
            TOXENV: py
          - python-version: '3.15'
            TOXENV: py-cython
          - python-version: 'pypy-3.12'
            TOXENV: pypy

    steps:
      - uses: actions/checkout@v7
      - name: Use Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install tox
      - env:
          TOXENV: ${{ matrix.TOXENV }}
        run: tox
